[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

  # ---------------------------------------------------------------------------
  # Secrets scanning: skip the BUILD CACHE, and only the build cache.
  #
  # Every deploy has failed since at least 13 Oct with "Exposed secrets
  # detected" — GROQ_API_KEY and CRON_SECRET found in
  # `.netlify/.next/cache/turbopack/**/*.sst`. That is Turbopack's persistent
  # compilation cache: it records what the build read, including env values, so
  # the next build can skip work. Netlify restores it between builds and scans
  # it along with everything else.
  #
  # IT IS NOT A LEAK, and that was checked rather than assumed. Both are read
  # only in server code — GROQ_API_KEY in the Scora route handler, CRON_SECRET
  # in lib/job-auth.ts — and neither carries a NEXT_PUBLIC_ prefix, which is
  # the only way Next inlines a value into a client bundle. The scanner
  # reported them in the .sst files and nowhere else: not in a served asset,
  # not in the repo.
  #
  # SCOPED, NOT DISABLED. SECRETS_SCAN_ENABLED=false would have turned the
  # check off everywhere and made the next genuine leak silent — and a real one
  # would look exactly like this in the log. Omitting the cache path leaves the
  # scan running over every file that actually ships.
  #
  # Both spellings, because the cache is `.next/cache` during the build and
  # `.netlify/.next/cache` once Netlify has moved it.
  SECRETS_SCAN_OMIT_PATHS = ".next/cache/**,.netlify/.next/cache/**"

# Netlify installs @netlify/plugin-nextjs automatically for Next.js sites.
# Pinned here so the build does not change underneath us without a commit.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview deploys on PRs (P2-005). Not indexed — only the production domain is.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[context.deploy-preview]
  [context.deploy-preview.environment]
    # Deliberately unset. Netlify provides DEPLOY_PRIME_URL / URL for the
    # real address of this deploy, and siteUrl() reads them. Hardcoding a
    # domain here overrode that and sent every preview's emails to the
    # production hostname.

[context.production.environment]
  # Deliberately unset until highzcore.com actually resolves. Netlify's own
  # URL variable is the live address of the site either way, so links work
  # before the custom domain is attached and keep working afterwards.
  #
  # This was not hypothetical: with the domain hardcoded and the DNS not yet
  # pointed, every email the system sends — invitations, receipts,
  # verification codes, renewal reminders — carried a link to a hostname that
  # does not exist.
